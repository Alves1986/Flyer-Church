<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FlyerForge">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0B0A08"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="100%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#BB9E49" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#BB9E49" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#BB9E49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#EAD9A0"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C7433"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5F5436"/>
      <stop offset="100%" stop-color="#3B341F"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#arcGlow)"/>

    <!-- forge arch motif, echoed faintly behind the monogram -->
    <path d="M 76 420 A 180 180 0 0 1 436 420" fill="none" stroke="#BB9E49" stroke-opacity="0.16" stroke-width="18"/>

    <!-- F monogram, condensed + bold, with a folded paper corner on the top bar -->
    <g>
      <rect x="153.6" y="102.4" width="61.44" height="307.2" fill="url(#goldGrad)"/>
      <rect x="153.6" y="225.28" width="174.08" height="61.44" fill="url(#goldGrad)"/>
      <path d="M 153.6 102.4 L 328.64 102.4 L 368.64 142.4 L 368.64 163.84 L 153.6 163.84 Z" fill="url(#goldGrad)"/>
      <!-- dog-ear fold accent -->
      <path d="M 328.64 102.4 L 368.64 102.4 L 368.64 142.4 Z" fill="url(#foldGrad)"/>
      <path d="M 328.64 102.4 L 368.64 142.4" stroke="#0B0A08" stroke-opacity="0.35" stroke-width="2"/>
    </g>

    <!-- spark accent -->
    <circle cx="392" cy="128" r="7" fill="#EAD9A0"/>
    <circle cx="392" cy="128" r="14" fill="#EAD9A0" opacity="0.25"/>
  </g>

  <rect x="4" y="4" width="504" height="504" rx="108" ry="108" fill="none" stroke="#BB9E49" stroke-opacity="0.35" stroke-width="6"/>
</svg>
